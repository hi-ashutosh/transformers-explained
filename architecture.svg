<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 820" width="1120" height="820" role="img" aria-labelledby="title description">
<title id="title">The original Transformer: connected encoder and decoder</title>
<desc id="description">Read bottom to top. Source tokens enter the encoder through embeddings and positional encoding. Each of six encoder layers contains unmasked self-attention, Add and Norm, a feed-forward network, and Add and Norm. Shifted target tokens enter the decoder. Each of six decoder layers contains masked self-attention, Add and Norm, cross-attention to encoder memory, Add and Norm, a feed-forward network, and Add and Norm. Residual paths bypass every attention and feed-forward sublayer. Encoder outputs provide keys and values to decoder cross-attention; the decoder supplies queries. A final linear projection and softmax produce next-token probabilities.</desc>
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#697672"/></marker>
 <marker id="skip-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#9ba6a0"/></marker>
 <marker id="memory-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#287b84"/></marker>
 <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#26352e" flood-opacity=".07"/></filter>
</defs>
